# application.properties (基本設定)
spring.application.name=TerraGroupLabsLandingPage
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.servlet.context-parameters.defaultHtmlEscape=true

# データベース接続の基本設定（URL等は環境別ファイルに記述）
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ログ設定
logging.level.com.terragrouplabs=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=WARN

# 静的リソースのキャッシュ期間設定
spring.web.resources.cache.period=31536000
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**/*.js,/**/*.css

# サーバー設定
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Spring Security のデバッグログを有効にする
logging.level.org.springframework.security=DEBUG
# Gzip 圧縮を有効にする
server.compression.enabled=true

# 圧縮対象とする MIME タイプを指定 (一般的なテキストベースのタイプを含める)
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# 圧縮を適用する最小のレスポンスサイズ (バイト単位、小さすぎると圧縮効果がない場合も)
# 例えば 2KB (2048バイト) 以上の場合に圧縮するなど
server.compression.min-response-size=2048

# プロファイル設定
spring.profiles.active=dev